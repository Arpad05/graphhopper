name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Restore previous mutation score from cache
        if: matrix.java-version == '24'
        uses: actions/cache/restore@v4
        with:
          path: mutation_score.txt
          key: mutation-score-${{ github.ref }}-dummy
          restore-keys: |
            mutation-score-${{ github.ref }}-
            mutation-score-
      
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test
      
      - name: Restore previous mutation score from cache
        if: matrix.java-version == '24'
        uses: actions/cache@v4
        with:
          path: mutation_score.txt
          key: mutation-score-${{ github.ref }}

      - name: Run PIT Mutation Testing
        if: matrix.java-version == '24'
        run: mvn -P mutation org.pitest:pitest-maven:mutationCoverage | tee pit-output.log

      - name: Extract mutation score (from XML)
        if: matrix.java-version == '24'
        id: mutation-score
        run: |
          REPORT_DIR="navigation/target/pit-reports"
          if [ ! -d "$REPORT_DIR" ]; then
            echo "current_score=0" >> $GITHUB_OUTPUT
            echo "No PIT report directory found at $REPORT_DIR"
            exit 0
          fi

          latest=$(ls -1dt "$REPORT_DIR"/* 2>/dev/null | head -n1 || true)
          xmlfile="$latest/mutations.xml"

          if [ -f "$xmlfile" ]; then
            score=$(grep -oP 'mutationCoverage[^>]*value="\K[0-9]+(\.[0-9]+)?' "$xmlfile" || true)
            if [ -z "$score" ]; then
              GENERATED=$(grep -oP 'Generated\W+\K[0-9]+' "$xmlfile" | awk '{s+=$1} END{print s+0}')
              KILLED=$(grep -oP 'Killed\W+\K[0-9]+' "$xmlfile" | awk '{s+=$1} END{print s+0}')
              if [ "$GENERATED" -gt 0 ]; then
                score=$((KILLED * 100 / GENERATED))
              else
                score=0
              fi
            else
              # round to integer
              score=$(printf "%.0f" "$score")
            fi
          else
            score=0
          fi

          echo "current_score=$score" >> $GITHUB_OUTPUT
          echo "$score" > mutation_score.txt
          echo "Current mutation score: $score%"

      - name: Get previous mutation score
        if: matrix.java-version == '24'
        id: previous-score
        run: |
          PREVIOUS_SCORE=$(cat mutation_score.txt 2>/dev/null || echo "0")
          echo "previous_score=$PREVIOUS_SCORE" >> $GITHUB_OUTPUT
          echo "Previous mutation score: $PREVIOUS_SCORE%"

      - name: Check mutation score and rickroll if lower
        if: matrix.java-version == '24'
        run: |
          CURRENT=${{ steps.mutation-score.outputs.current_score }}
          PREVIOUS=${{ steps.previous-score.outputs.previous_score }}

          CURRENT=${CURRENT:-0}
          PREVIOUS=${PREVIOUS:-0}

          echo "Previous: $PREVIOUS%, Current: $CURRENT%"

          if [ "$CURRENT" -lt "$PREVIOUS" ]; then
            echo "Le score de mutation a baissé !!"
            echo "Never gonna give you up"
            echo "Never gonna let you down"
            echo "Never gonna run and leave you dry"
            echo "Never gonna make you cry"
            echo "Never gonna say 'Good try'"
            echo "Never gonna tell a lie and compile for you"
            echo ""
            echo "Score précédent: $PREVIOUS%"
            echo "Score actuel: $CURRENT%"
            echo "Différence: -$((PREVIOUS - CURRENT))%"
            exit 1
          else
            echo "Mutation score maintained or improved!"
            echo "Previous: $PREVIOUS%"
            echo "Current: $CURRENT%"
          fi

      - name: Cache mutation score for next run
        if: matrix.java-version == '24'
        uses: actions/cache@v4
        with:
          path: mutation_score.txt
          key: mutation-score-${{ github.ref }}

      - name: Upload PIT reports
        if: matrix.java-version == '24'
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: navigation/target/pit-reports/
