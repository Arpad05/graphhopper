name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Restore previous mutation score from cache
        if: matrix.java-version == '24'
        uses: actions/cache/restore@v4
        with:
          path: mutation_score.txt
          key: mutation-score-${{ github.ref }}-dummy
          restore-keys: |
            mutation-score-${{ github.ref }}-
            mutation-score-
      
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test
      
      - name: Restore previous mutation score from cache
        if: matrix.java-version == '24'
        uses: actions/cache@v4
        with:
          path: mutation_score.txt
          key: mutation-score-${{ github.ref }}

      - name: Run PIT Mutation Testing
        if: matrix.java-version == '24'
        run: mvn -P mutation org.pitest:pitest-maven:mutationCoverage | tee pit-output.log

      - name: Extract mutation score (try XML then console)
        if: matrix.java-version == '24'
        id: mutation-score
        run: |
          REPORT_DIR="navigation/target/pit-reports"
          CONSOLE_LOG="pit-output.log"
          set_score() {
            score="$1"
            echo "current_score=$score" >> $GITHUB_OUTPUT
            echo "$score" > mutation_score.txt
            echo "Current mutation score: $score%"
          }
          if [ -d "$REPORT_DIR" ]; then
            latest=$(ls -1dt "$REPORT_DIR"/* 2>/dev/null | head -n1 || true)
            xmlfile="$latest/mutations.xml"
          else
            xmlfile=""
          fi
          score=""
          if [ -n "$xmlfile" ] && [ -f "$xmlfile" ]; then
            if command -v xmllint >/dev/null 2>&1; then
              score=$(xmllint --xpath 'string(//@mutationCoverage)' "$xmlfile" 2>/dev/null || true)
              # try a couple of alternate locations
              if [ -z "$score" ]; then
                score=$(xmllint --xpath 'string(/mutations/@mutationCoverage)' "$xmlfile" 2>/dev/null || true)
              fi
              if [ -z "$score" ]; then
                score=$(xmllint --xpath 'string(/report/@mutationCoverage)' "$xmlfile" 2>/dev/null || true)
              fi
            fi
            if [ -z "$score" ]; then
              GENERATED=$(grep -o '<mutation\b' "$xmlfile" | wc -l || true)
              KILLED=$(grep -o 'status="KILLED"' "$xmlfile" | wc -l || true)
              GENERATED=${GENERATED:-0}
              KILLED=${KILLED:-0}
              if [ "$GENERATED" -gt 0 ]; then
                score=$(( KILLED * 100 / GENERATED ))
              else
                score=""
              fi
            fi
          fi
          if [ -z "$score" ]; then
            if [ -f "$CONSOLE_LOG" ]; then
              line=$(grep -Eo 'Generated[[:space:]]+[0-9]+[^\\n]*Killed[[:space:]]+[0-9]+' "$CONSOLE_LOG" | head -n1 || true)
              if [ -n "$line" ]; then
                GENERATED=$(echo "$line" | grep -oP 'Generated\s*\K[0-9]+' || echo "0")
                KILLED=$(echo "$line" | grep -oP 'Killed\s*\K[0-9]+' || echo "0")
                if [ "$GENERATED" -gt 0 ]; then
                  score=$(( KILLED * 100 / GENERATED ))
                else
                  score=""
                fi
              fi
            fi
          fi
          if [ -z "$score" ]; then
            score=0
          else
            # ensure integer output (round)
            score=$(printf "%.0f" "$score")
          fi

          set_score "$score"

      - name: Get previous mutation score
        if: matrix.java-version == '24'
        id: previous-score
        run: |
          PREVIOUS_SCORE=$(cat mutation_score.txt 2>/dev/null || echo "0")
          echo "previous_score=$PREVIOUS_SCORE" >> $GITHUB_OUTPUT
          echo "Previous mutation score: $PREVIOUS_SCORE%"

      - name: Check mutation score and rickroll if lower
        if: matrix.java-version == '24'
        run: |
          CURRENT=${{ steps.mutation-score.outputs.current_score }}
          PREVIOUS=${{ steps.previous-score.outputs.previous_score }}

          CURRENT=${CURRENT:-0}
          PREVIOUS=${PREVIOUS:-0}

          echo "Previous: $PREVIOUS%, Current: $CURRENT%"

          if [ "$CURRENT" -lt "$PREVIOUS" ]; then
            echo "Le score de mutation a baissé !!"
            echo "Never gonna give you up"
            echo "Never gonna let you down"
            echo "Never gonna run and leave you dry"
            echo "Never gonna make you cry"
            echo "Never gonna say 'Good try'"
            echo "Never gonna tell a lie and compile for you"
            echo ""
            echo "Score précédent: $PREVIOUS%"
            echo "Score actuel: $CURRENT%"
            echo "Différence: -$((PREVIOUS - CURRENT))%"
            # si tu veux faire échouer le job quand régression:
            exit 1
          else
            echo "Mutation score maintained or improved!"
            echo "Previous: $PREVIOUS%"
            echo "Current: $CURRENT%"
          fi

      - name: Cache mutation score for next run
        if: matrix.java-version == '24'
        uses: actions/cache@v4
        with:
          path: mutation_score.txt
          key: mutation-score-${{ github.ref }}

      - name: Upload PIT reports
        if: matrix.java-version == '24'
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: navigation/target/pit-reports/
