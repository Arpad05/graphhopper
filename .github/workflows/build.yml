name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Restore previous mutation score from cache
        if: matrix.java-version == '24'
        uses: actions/cache/restore@v4
        with:
          path: mutation_score.txt
          key: mutation-score-${{ github.ref }}-dummy
          restore-keys: |
            mutation-score-${{ github.ref }}-
            mutation-score-
      
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test
      
      - name: Run PIT Mutation Testing
        if: matrix.java-version == '24'
        run: mvn -P mutation org.pitest:pitest-maven:mutationCoverage | tee pit-output.log
      
      - name: Extract mutation score
        if: matrix.java-version == '24'
        id: mutation-score
        run: |
          if [ -f "pit-output.log" ]; then
            SCORE_LINE=$(grep "Generated.*mutations Killed" pit-output.log | tail -1)
            CURRENT_SCORE=$(echo "$SCORE_LINE" | grep -oP '\(\K[0-9]+(?=%\))' || echo "0")
            echo "current_score=$CURRENT_SCORE" >> $GITHUB_OUTPUT
            echo "Current mutation score: $CURRENT_SCORE%"
            echo "Full line: $SCORE_LINE"
          else
            echo "current_score=0" >> $GITHUB_OUTPUT
            echo "No PIT output found"
          fi
      
      - name: Get previous mutation score
        if: matrix.java-version == '24'
        id: previous-score
        run: |
          # Try to get the previous score from the last successful run
          PREVIOUS_SCORE=$(cat mutation_score.txt 2>/dev/null || echo "0")
          echo "previous_score=$PREVIOUS_SCORE" >> $GITHUB_OUTPUT
          echo "Previous mutation score: $PREVIOUS_SCORE%"
      
      - name: Check mutation score and rickroll if lower
        if: matrix.java-version == '24'
        run: |
          CURRENT=${{ steps.mutation-score.outputs.current_score }}
          PREVIOUS=${{ steps.previous-score.outputs.previous_score }}
          
          if [ "$CURRENT" -lt "$PREVIOUS" ]; then
            echo "Le score de mutation a baissé !!"
            echo "Never gonna give you up"
            echo "Never gonna let you down"
            echo "Never gonna fail the tests and desert you"
            echo "Never gonna make you cry"
            echo "Never gonna say 'Good try'"
            echo "Never gonna tell a lie and compile for you"
            echo ""
            echo "Score précédent: $PREVIOUS%"
            echo "Score actuel: $CURRENT%"
            echo "Différence: -$((PREVIOUS - CURRENT))%"
          else
            echo "Mutation score maintained or improved!"
            echo "Previous: $PREVIOUS%"
            echo "Current: $CURRENT%"
          fi
      
      - name: Save current mutation score
        if: matrix.java-version == '24'
        run: |
          echo "${{ steps.mutation-score.outputs.current_score }}" > mutation_score.txt
      
      - name: Cache mutation score for next run
        if: matrix.java-version == '24'
        uses: actions/cache/save@v4
        with:
          path: mutation_score.txt
          key: mutation-score-${{ github.ref }}-${{ github.sha }}
      
      - name: Upload mutation score
        if: matrix.java-version == '24'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-score
          path: mutation_score.txt
      
      - name: Upload PIT reports
        if: matrix.java-version == '24'
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: navigation/target/pit-reports/