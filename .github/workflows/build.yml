name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test
  mutation:
    name: Run PIT by module and compare baseline
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Instattall jq and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
      - name: Run PIT and compare to baseline
        id: pit_check
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_FILE="pit-baseline.json"
          REGRESSION=false
          REGRESSIONS=()
          if [[ ! -f "$BASELINE_FILE" ]]; then
            echo "{}" > "$BASELINE_FILE"
            echo "Created empty $BASELINE_FILE as no baseline existed."
          fi
          extract_score() {
            local rpt="$1"
            local latest
            latest=$(ls -1dt "$rpt"/* 2>/dev/null | head -n1 || true)
            if [[ -z "$latest" ]]; then
              echo ""
              return
            fi
            if [[ -f "$latest/mutations.xml" ]]; then
              local val
              val=$(grep -oP 'mutationCoverage[^>]*value="\K[0-9]+(\.[0-9]+)?' "$latest/mutations.xml" || true)
              if [[ -n "$val" ]]; then
                printf "%.2f" "$val"
                return
              fi
              local killed total
              killed=$(grep -c '<mutation[^>]*status="KILLED"' "$latest/mutations.xml" || true)
              total=$(grep -c '<mutation ' "$latest/mutations.xml" || true)
              if [[ -n "$total" && "$total" -gt 0 ]]; then
                awk -v k="$killed" -v t="$total" 'BEGIN{ printf("%.2f", (k/t)*100) }'
                return
              fi
            fi
            if [[ -f "$latest/index.html" ]]; then
              local pct
              pct=$(grep -oP 'Mutation (coverage|score)[^0-9]*\K[0-9]+(\.[0-9]+)?' "$latest/index.html" | head -n1 || true)
              if [[ -n "$pct" ]]; then
                printf "%.2f" "$pct"
                return
              fi
            fi
            echo ""
          }
          MODULES=()
          while IFS= read -r -d '' d; do
            MODULES+=("$(dirname "$d")")
          done < <(find . -maxdepth 2 -type f -name pom.xml -print0 | sort -z)
          MAP_MODULES=()
          for p in "${MODULES[@]}"; do
            dir=$(echo "$p" | sed 's|^\./||')
            # skip root pom
            if [[ "$dir" == "." || -f "./src/main/java" ]]; then
              # if root has src/main/java, keep it; else skip root
              if [[ ! -d "./src" ]]; then
                continue
              fi
            fi
            MAP_MODULES+=("$dir")
          done
          MODULES=($(printf "%s\n" "${MAP_MODULES[@]}" | awk '!seen[$0]++'))
          echo "Detected modules: ${MODULES[*]}"
          # read baseline JSON
          declare -A BASE
          while IFS=$'\t' read -r k v; do
            BASE["$k"]="$v"
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value)"' "$BASELINE_FILE" 2>/dev/null || true)
          declare -A CURRENT
          for m in "${MODULES[@]}"; do
            echo ">>> Processing module: $m"
            # skip modules without src (likely packaging pom)
            if [[ ! -d "$m/src" ]]; then
              echo "  - skipping (no src/)"
              continue
            fi
            pushd "$m" >/dev/null
            echo "  - running PIT for $m (may take time)..."
            # run PIT; keep verbose output to logs. Timeout or resource constraints can be added as needed.
            if ! mvn -B org.pitest:pitest-maven:mutationCoverage; then
              echo "  - PIT failed for $m; skipping score extraction"
              popd >/dev/null
              continue
            fi
            if [[ -d target/pit-reports ]]; then
              score=$(extract_score "target/pit-reports")
            else
              score=""
            fi
            if [[ -z "$score" ]]; then
              echo "  - could not extract score for $m"
              popd >/dev/null
              continue
            fi
            echo "  - current score: ${score}%"
            CURRENT["$m"]="$score"
            popd >/dev/null
          done
          for k in "${!CURRENT[@]}"; do
            cur=${CURRENT[$k]}
            base=${BASE[$k]:-}
            if [[ -z "$base" ]]; then
              echo "Module $k: no baseline (current ${cur}%)"
              continue
            fi
            if awk -v c="$cur" -v b="$base" 'BEGIN{ if ((c+0) < (b+0)) exit 0; else exit 1 }'; then
              echo "REGRESSION: $k baseline=${base}% -> current=${cur}%"
              REGRESSION=true
              REGRESSIONS+=("$k")
            else
              echo "OK: $k baseline=${base}% -> current=${cur}%"
            fi
          done
          echo "::set-output name=regression::$REGRESSION"
          # join regressions by comma
          if [[ ${#REGRESSIONS[@]} -gt 0 ]]; then
            reglist=$(IFS=, ; echo "${REGRESSIONS[*]}")
          else
            reglist=""
          fi
          echo "::set-output name=modules::$reglist"
      - name: Show outputs
        run: |
          echo "regression = ${{ steps.pit_check.outputs.regression }}"
          echo "modules    = ${{ steps.pit_check.outputs.modules }}"
  rickroll:
    needs: build
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Rickroll on failure
        run: |
          echo "Le score de mutation a baissé !!"
          echo "Never gonna give you up"
          echo "Never gonna let you down"
          echo "Never gonna fail the tests and desert you"
          echo "Never gonna make you cry"
          echo "Never gonna say 'Good try'"
          echo "Never gonna tell a lie and compile for you"